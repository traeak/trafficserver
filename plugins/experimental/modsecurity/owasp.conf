## Top-level configuration for the OWASP Core Rule Set. See README.md.
##
## Expected next to this file:
##   modsecurity.conf   ModSecurity's modsecurity.conf-recommended, with
##                      SecRuleEngine On and a writable SecAuditLog
##   unicode.mapping    ModSecurity's unicode.mapping
##   (both from https://github.com/owasp-modsecurity/ModSecurity, at the tag
##   matching the installed libmodsecurity)
##   crs/               the Core Rule Set release, with crs-setup.conf copied
##                      from crs-setup.conf.example

Include "modsecurity.conf"
Include "crs/crs-setup.conf"

## libmodsecurity has no IncludeOptional, and a pattern that matches no file
## fails the load: keep the empty placeholder files the CRS ships in plugins/.
Include "crs/plugins/*-config.conf"
Include "crs/plugins/*-before.conf"
Include "crs/rules/*.conf"
Include "crs/plugins/*-after.conf"

# Uncomment the following 2 lines to enable debugging and put debug logs in /tmp/debug.log
#SecDebugLog /tmp/debug.log
#SecDebugLogLevel 9

# The modsecurity plugin does not hand request or response bodies to
# ModSecurity, so the CRS body rules can never match. Removing them saves the
# evaluation cost.
#SecRuleRemoveById 920240
