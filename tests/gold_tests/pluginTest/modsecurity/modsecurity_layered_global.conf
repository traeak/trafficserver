SecRuleEngine On

# The system-wide baseline.
SecRule ARGS:g "@streq block" "id:3001,phase:1,deny,status:403"
SecRule RESPONSE_HEADERS:x-global "@streq block" "id:3002,phase:3,deny,status:403"

# Turns the remap instance's 406 into a 410, should the global plugin inspect that
# block response.
SecRule RESPONSE_STATUS "@streq 406" "id:3003,phase:3,deny,status:410"
