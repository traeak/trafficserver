SecRuleEngine On

SecRule ARGS:testparam "@contains test2" "id:1234,deny,status:403"
SecRule ARGS:testparam "@contains test1" "id:1235,status:301,redirect:https://www.example.com/"
SecRule RESPONSE_HEADERS:test "@contains 1" "id:1236,phase:3,deny,status:403"
SecRule RESPONSE_HEADERS:test "@contains 2" "id:1237,phase:3,status:301,redirect:https://www.example.com/"

# A redirect target built from decoded request data. The plugin must not let a
# request smuggle a control character into the Location header through it.
SecRule ARGS:testparam "@contains test3" "id:1238,status:302,redirect:'https://www.example.com/?u=%{REQUEST_URI}'"

# A redirect that sets status 200. libmodsecurity 3.0.14 already answers it with
# a 302, and the plugin forces one as well, so the request is blocked either way.
# The plugin's own handling is covered by its unit tests.
SecRule ARGS:testparam "@contains test5" "id:1239,status:200,redirect:https://www.example.com/"
