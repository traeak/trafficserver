meta:
  version: "1.0"

autest:
  description: 'Inspect request bodies and block attacks in them'

  dns:
    name: 'dns'

  server:
    name: 'server'

  client:
    name: 'client'

  ats:
    name: 'ts'

    process_config:
      enable_cache: false

    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: modsecurity
      proxy.config.http.post_copy_size: 4096

    copy_to_config_dir:
      - modsecurity_body_rules.conf

    plugin_config:
      - name: 'modsecurity.so'
        args:
          - 'modsecurity_body_rules.conf'
          - '--inspect-request-body'

    remap_config:
      - from: "http://example.com/"
        to: "http://backend.example.com:{SERVER_HTTP_PORT}/"

    metric_checks:
      - metric: "proxy.process.plugin.modsecurity.interventions.request"
        value: 3
      - metric: "proxy.process.plugin.modsecurity.interventions.response"
        value: 0

sessions:
- transactions:

  - client-request:
      method: POST
      url: /submit
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [Content-Type, 'application/x-www-form-urlencoded']
        - [Content-Length, '11']
        - [uuid, body-on-benign]
      content:
        encoding: plain
        data: 'q=hello&r=1'

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "0"]

    proxy-response:
      status: 200

  - client-request:
      method: POST
      url: /submit
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [Content-Type, 'application/x-www-form-urlencoded']
        - [Content-Length, '15']
        - [uuid, body-on-form]
      content:
        encoding: plain
        data: 'q=an+attack&r=1'

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "0"]

    proxy-response:
      status: 403

  - client-request:
      method: POST
      url: /submit
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [Content-Type, 'application/json']
        - [Content-Length, '17']
        - [uuid, body-on-json]
      content:
        encoding: plain
        data: '{"q":"an attack"}'

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "0"]

    proxy-response:
      status: 403

  - client-request:
      method: POST
      url: /submit
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [Content-Type, 'application/x-www-form-urlencoded']
        - [Transfer-Encoding, chunked]
        - [uuid, body-on-chunked]
      content:
        transfer: plain
        encoding: uri
        data: f%0D%0Aq%3Dan%20attack%26r%3D1%0D%0A0%0D%0A%0D%0A

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "0"]

    proxy-response:
      status: 403
