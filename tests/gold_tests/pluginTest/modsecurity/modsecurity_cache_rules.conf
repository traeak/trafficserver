SecRuleEngine On

# Response phase rules that look only at the request. They match on a cache hit
# even though the cached response passed the same rules when it was fetched, so
# they can only fire there if the plugin inspects responses served from cache.
SecRule REQUEST_HEADERS:X-Test "@streq block" "id:9101,phase:3,deny,status:403"
SecRule REQUEST_HEADERS:X-Test "@streq redirect" "id:9102,phase:3,status:302,redirect:https://www.example.com/"
