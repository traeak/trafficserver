SecRuleEngine On
SecRequestBodyAccess On

# Route JSON bodies to the JSON processor, as the recommended configuration does.
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
    "id:5000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

# Phase 2 rules: they need the request body, so they match only when the plugin
# inspects it.
SecRule ARGS_POST:q "@contains attack" "id:5001,phase:2,deny,status:403"
SecRule ARGS:json.q "@contains attack" "id:5002,phase:2,deny,status:403"
