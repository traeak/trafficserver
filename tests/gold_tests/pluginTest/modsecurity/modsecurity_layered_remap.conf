SecRuleEngine On

# Affects only this instance's own rule set, so it cannot relax the baseline.
SecRuleRemoveById 3001

# The endpoint-specific rule.
SecRule ARGS:r "@streq block" "id:4001,phase:1,deny,status:406"

# Turns the global plugin's 403 into a 410, should this instance inspect that
# block response.
SecRule RESPONSE_STATUS "@streq 403" "id:4003,phase:3,deny,status:410"
